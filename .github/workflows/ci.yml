---
# CI de andes-config: valida Terraform y Ansible y busca fallos de seguridad en cada push y PR.
# Las actions van fijadas por SHA de commit (no por etiqueta) para que nadie pueda cambiarlas por debajo.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secretos en todo el historial)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # historial completo: un secreto borrado despues sigue en git
          persist-credentials: false
      - name: Instalar gitleaks (binario oficial verificado con SHA-256)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Escaneo de secretos
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v .

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Formato
        run: terraform fmt -check -recursive -diff
      # Sin backend: CI nunca toca el estado ni Proxmox (no tiene token ni red hacia el lab)
      - name: Init sin backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  ansible:
    name: Ansible (ansible-lint, perfil production)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Herramientas
        run: |
          pip install --disable-pip-version-check "ansible-lint==26.11.0"
          ansible-galaxy collection install -r requirements.yml
      # El Vault se queda cifrado: CI usa una contrasena falsa y ansible-lint lo excluye
      - name: ansible-lint
        run: |
          echo "ci-sin-secretos" > "$RUNNER_TEMP/vault-pass"
          ANSIBLE_VAULT_PASSWORD_FILE="$RUNNER_TEMP/vault-pass" ansible-lint --nocolor

  imagen:
    name: Imagen Andes App (build, Trivy y GHCR)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # solo este job puede publicar en GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la imagen
        run: |
          version=$(sed -nE 's/^ *image: andes-app:([0-9.]+).*/\1/p' ansible/roles/andes_app/files/compose.yaml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build -t "andes-app:$version" ansible/roles/andes_app/files/app
      # Solo se publica si no hay vulnerabilidades CRITICAL con parche disponible
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: andes-app:${{ env.VERSION }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Publicar en GHCR (solo en main del repositorio de trabajo)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'GUAR-NIX/andes-config'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/andes-app"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" "$VERSION-${GITHUB_SHA::7}"; do
            docker tag "andes-app:$VERSION" "$img:$tag"
            docker push "$img:$tag"
          done
          docker logout ghcr.io

  trivy:
    name: Trivy (secretos, configuracion y dependencias)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
