---
# Rol wazuh_agent: agente del SIEM con version fija (debe coincidir con el manager)
- name: Clave del repositorio de Wazuh
  ansible.builtin.copy:
    src: wazuh.gpg
    dest: /usr/share/keyrings/wazuh.gpg
    owner: root
    group: root
    mode: "0644"

- name: Repositorio de Wazuh
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/wazuh.list
    content: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main\n"
    owner: root
    group: root
    mode: "0644"
  register: wazuh_agent_repo

# Si el repositorio se acaba de anadir hay que releer el indice aunque apt se actualizara
# hace poco (cloud-init); si no, el paquete "no existe" (fallo descubierto en la T30)
- name: Agente instalado en la version del manager
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_agent_version }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if wazuh_agent_repo is changed else 3600 }}"
  environment:
    WAZUH_MANAGER: "{{ wazuh_agent_manager }}"
    WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"

- name: Version retenida (no se actualiza sola por delante del manager)
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Direccion del manager
  ansible.builtin.replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>[^<]*</address>'
    replace: '<address>{{ wazuh_agent_manager }}</address>'
  notify: Reiniciar agente Wazuh

- name: Grupo del agente al registrarse
  ansible.builtin.replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '(<enrollment>[\s\S]*?<groups>)[^<]*(</groups>)'
    replace: '\g<1>{{ wazuh_agent_group }}\g<2>'
  notify: Reiniciar agente Wazuh

# Servidor reconstruido: client.keys vacio. El manager rechaza un nombre ya registrado
# (hasta 1 h desconectado), asi que antes de arrancar se da de baja el registro antiguo.
- name: Claves del agente (vacias en un servidor recien creado)
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: wazuh_agent_keys

- name: Servidor nuevo - baja en el manager del registro anterior con el mismo nombre
  ansible.builtin.shell: |
    set -o pipefail
    id=$(/var/ossec/bin/manage_agents -l | sed -nE 's/^ *ID: ([0-9]+), Name: {{ inventory_hostname }},.*/\1/p')
    if [ -n "$id" ]; then /var/ossec/bin/manage_agents -r "$id" >/dev/null && echo "baja del agente $id"; fi
  args:
    executable: /bin/bash
  delegate_to: srv-siem01
  # Si el SIEM esta apagado (perfil de encendido sin SEGURIDAD), seguir: el agente se registrara al volver,
  # y para entonces el registro antiguo llevara > 1 h desconectado (Wazuh permite reemplazarlo)
  ignore_unreachable: true
  register: wazuh_agent_baja
  changed_when: "'baja del agente' in wazuh_agent_baja.stdout"
  when: wazuh_agent_keys.stat.size | default(0) == 0

- name: Agente activo
  ansible.builtin.systemd_service:
    name: wazuh-agent
    enabled: true
    state: started
