---
# Rol docker: Docker CE del repositorio oficial con logs limitados y no-new-privileges
- name: Clave del repositorio de Docker
  ansible.builtin.copy:
    src: docker.asc
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Repositorio de Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable\n"
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

- name: Paquetes de Docker (relee el indice si el repositorio es nuevo)
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if docker_repo is changed else 3600 }}"

- name: Configuracion del demonio
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar Docker

- name: Docker activo
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
