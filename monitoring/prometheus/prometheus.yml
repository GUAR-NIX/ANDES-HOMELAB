global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml, /etc/prometheus/slo.yml]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["10.10.10.10:9100", "10.10.10.20:9100", "10.10.20.30:9100", "10.10.50.10:9100"]
  - job_name: windows
    static_configs:
      - targets: ["10.10.20.20:9182"]
        labels: { host: dc01 }
  - job_name: blackbox-https
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://app.corp.lab.internal/health", "https://srv-web01.corp.lab.internal"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
  - job_name: pve01
    static_configs:
      - targets: ["192.168.188.10:9100"]
        labels: { host: pve01 }
